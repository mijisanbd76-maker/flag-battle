<script>
const VW=700,VH=1240,AX=350,AY=552,AR=290,SHELF_Y=1027;
const CFG={foot:'Flags Battle World',goal:'Please Help Today Target 1000 Subscriber Goal',qmin:30,flagCount:212,speed:1.3,music:true,voice:true};
const CODES=Object.keys(FL);
const EN={'GB-ENG':'England','GB-SCT':'Scotland'},NAME={'england':'GB-ENG','scotland':'GB-SCT'};
try{const e=new Intl.DisplayNames(['en'],{type:'region'}),b=new Intl.DisplayNames(['bn'],{type:'region'});
CODES.forEach(c=>{if(EN[c])return;let n=c;try{n=e.of(c).replace(' and ',' & ')}catch(_){}EN[c]=n;NAME[n.toLowerCase()]=c;try{NAME[b.of(c)]=c}catch(_){}})}catch(_){CODES.forEach(c=>{if(!EN[c])EN[c]=c})}
Object.assign(NAME,{usa:'US',america:'US',uk:'GB',uae:'AE','south korea':'KR','north korea':'KP'});
const KEYS=Object.keys(NAME).sort((a,b)=>b.length-a.length);
function findCountry(t){const s=' '+t.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,' ').replace(/\s+/g,' ').trim()+' ';for(const k of KEYS)if(s.includes(' '+k+' '))return NAME[k];return null}
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

// ===== ক্যানভাস =====
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let S=1,OX=0,OY=0,D=1;
function rs(){D=devicePixelRatio||1;cv.width=innerWidth*D;cv.height=innerHeight*D;S=Math.min(innerWidth/VW,innerHeight/VH);OX=(innerWidth-VW*S)/2;OY=(innerHeight-VH*S)/2}
addEventListener('resize',rs);rs();
const IM={};function img(c){return IM[c]||(IM[c]=Object.assign(new Image(),{src:FL[c]}))}
CODES.forEach(img);
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function dflag(code,x,y,w,rot,al){const im=img(code);if(!im.naturalWidth)return;
 const k=w/36,asp=im.naturalWidth/im.naturalHeight;let h=24*k,ww=h*asp;if(ww>40*k){ww=40*k;h=ww/asp}
 ctx.save();ctx.globalAlpha=al==null?1:al;ctx.translate(x,y);ctx.rotate(rot||0);ctx.drawImage(im,-ww/2,-h/2,ww,h);ctx.restore()}

// ===== সাউন্ড =====
let AC,MG,SFX,MASTER,lastPop=0,mNext=0,mStep=0;
function note(f,t,d,type,v,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||SFX||AC.destination);o.start(t);o.stop(t+d+.02)}
function sweep(f1,f2,d,type,v){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(SFX||AC.destination);o.start(t);o.stop(t+d)}
function pop(){if(!AC)return;const n=performance.now();if(n-lastPop<28)return;lastPop=n;sweep(500+Math.random()*500,160,.13,'sine',.62)}
function tick(f){if(AC)note(f,AC.currentTime,.22,'triangle',.72)}
function arp(a,v){if(!AC)return;a.forEach((f,i)=>note(f,AC.currentTime+i*.13,.35,'triangle',v||.4))}
function stinger(k){if(!AC)return;
 if(k===0){[880,1175,1568,2093].forEach((f,i)=>note(f,AC.currentTime+i*.08,.5,'sine',.35))}
 else if(k===1)sweep(90,700,1.2,'sawtooth',.3);
 else if(k===2){sweep(300,50,.9,'sawtooth',.4);sweep(1200,100,.6,'square',.15)}
 else{[392,494,587,784].forEach((f,i)=>note(f,AC.currentTime+i*.1,.4,'triangle',.4))}}
const CH=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]];
function music(){if(!AC||!CFG.music)return;const now=AC.currentTime;if(mNext<now)mNext=now+.05;
 while(mNext<now+.3){const s=mStep%64,ch=CH[s>>4&3];
  if(s%16===0){note(ch[0]/2,mNext,.9,'sine',.075,MG);note(ch[1]/2,mNext,.9,'sine',.065,MG)}
  if(s%4===0)note(ch[0],mNext,.30,'triangle',.10,MG);
  if(s%8===4)note(ch[2],mNext,.42,'sine',.085,MG);
  note(ch[[0,1,2,1][s%4]]*2,mNext,.20,'triangle',.09,MG);mNext+=.125;mStep++}}
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices().filter(x=>/^en([-_]|$)/i.test(x.lang));
  voice=v.find(x=>/male|david|mark|guy|daniel|alex|aaron|james|google uk english male/i.test(x.name))||
        v.find(x=>/en[-_]US/i.test(x.lang))||v[0]||null}catch(_){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(_){}
function say(t){if(!CFG.voice)return;try{speechSynthesis.resume();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang='en-US';u.rate=.90;u.pitch=.86;u.volume=1;speechSynthesis.speak(u)}catch(_){}}
